name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install
        run: bun install

      - name: Create wrangler.toml
        run: |
          cat > wrangler.toml << 'EOF'
          name = "image-distortion-remover"
          compatibility_date = "2025-09-27"
          pages_project = "image-distortion-remover"
          EOF

      - name: Build
        run: bun run build

      - name: Deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 4a231bf78ffa10bfebe25d64ca3fc44f
          projectName: image-distortion-remover
          directory: .next
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
