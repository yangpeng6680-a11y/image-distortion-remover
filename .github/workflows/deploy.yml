name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install
        run: bun install

      - name: Build
        run: |
          echo "Creating open-next.config.ts..."
          cat > open-next.config.ts << 'EOF'
          import type { OpenNextConfig } from '@opennextjs/cloudflare'
          
          const config: OpenNextConfig = {
            default: {
              override: {
                wrapper: 'opennextjs-cloudflare',
                converter: 'opennextjs-cloudflare',
                incrementalCache: 'opennextjs-cloudflare',
                tagCache: 'opennextjs-cloudflare',
                queue: 'opennextjs-cloudflare',
              },
            },
          }
          
          export default config
          EOF
          echo "y" | bunx opennextjs-cloudflare build

      - name: Deploy
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
